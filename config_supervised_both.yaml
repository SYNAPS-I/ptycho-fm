# PtychoViT — RUN 3 of 3: SUPERVISED + BOTH probes (all 8 objects)
# Aileen 2-probe dataset, no probe restriction. This is the mixed-probe case your
# hypothesis says should train worse than the two single-probe runs.
# Identical to the single-probe configs except probe_filter (none) / run_num.

# Data Configuration
data:
  data_path: '/flare/SYNAPS-I/aileen/data'
  test_path: '/flare/SYNAPS-I/aileen/test_data/scan807_dp.hdf5'
  scale: 10000.0

  normalization_dict_path: '/flare/SYNAPS-I/aileen/data/normalization.pkl'
  test_normalization: '/flare/SYNAPS-I/aileen/test_data/test2probes_norm.pkl'
  data_fraction: 1.0
  probe_filter: null        # <-- BOTH probes: use all 8 objects
  cache_object: true
  train_split: 0.95
  random_seed: 8
  max_probe_modes: 10

  sharding_strategy: 'static'
  num_workers: 0
  prefetch_factor: 1
  pin_memory: true
  persistent_workers: true
  use_cuda_prefetcher: false

# Training Configuration
training:
  mode: 'supervised'
  batch_size: 64
  learning_rate: 1.0e-4
  epochs: 50

  encoder_lr: 1.0e-4
  amp_decoder_lr: 1.0e-4
  ph_decoder_lr: 1.0e-4

  loss_function: 'mse'

  validation_plot_freq: 10
  test_plot_freq: 20
  resume_from_checkpoint: false

# Model Architecture (identical across all 3 runs)
model:
  init:
    enabled: false
    method: 'trunc_normal'  # options: trunc_normal, kaiming
    mean: 0.0
    std: 0.02
    apply_to: ['encoder', 'decoders']  # options: encoder, decoders
    override_pretrained: false
    kaiming:
      distribution: 'uniform'  # options: uniform, normal
      mode: 'fan_in'           # options: fan_in, fan_out
      nonlinearity: 'relu'     # options: relu, leaky_relu, linear, etc.
      a: 0.0                   # negative slope for leaky_relu
  encoder_type: 'custom'  # Options: 'custom', 'pretrained'
  # Encoder Configuration
  encoder:
    img_size: 256
    patch_size: 16
    in_channels: 1
    embed_dim: 512
    depth: 12
    num_heads: 8
    mlp_ratio: 4.0
    use_cls_token: false
    dropout: 0.1
    attn_dropout: 0.0
    # Pretrained source
    timm_model_name: 'vit_large_patch32_224' #initialization with ViT_L_32 model weights'
    timm_kwargs:
      pretrained: false          # set true to download timm weights instead of local checkpoint
    checkpoint_path: 'model.safetensors'  # local pretrained weights
    checkpoint_kwargs:
      strict: true
  decoder:
    base_channels: 64
    latent_dim: 512
    num_stages: 4        # 8x8 → 256x256 for patch_size=32
    use_batchnorm: true
    dropout: 0.1
# Paths
paths:
  model_save_path: '/flare/datascience/vsastry/projects/ptcho_vit/ptycho-vit/scratch/models'

# WandB Configuration
wandb:
  enabled: True
  entity: 'varunisastry'
  project: 'PtychoViT'
  dataset_name: 'aileen both probes'
  notes: 'supervised, both 4- and 8-mode probes (all 8 objects)'
  resume_run_id: null

# Trainer Configuration
trainer:
  run_num: 48      # RUN 3 of 3 (both probes)

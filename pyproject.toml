[project]
name = "ptycho-fm"
version = "0.1.0"
description = "A foundation model for single-shot coherent diffractive imaging"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.15.0",
    "hdf5plugin>=6.0.0",
    "matplotlib>=3.10.7",
    "mlflow>=3.0.0",
    "numpy>=2.3.3",
    "onnx>=1.17.0",
    "pandas>=2.3.3",
    "ptychi>=1.5.0",
    "pyyaml>=6.0.3",
    "scikit-image>=0.25.2",
    "scipy>=1.16.3",
    "timm>=1.0.22",
    "torch>=2.6.0",
    "torchinfo>=1.8.0",
    "tqdm>=4.67.1",
    "wandb>=0.22.2",
]

[project.optional-dependencies]
viz = [
    "cmcrameri>=1.9",
    "seaborn>=0.13.2",
]
mpi = [
    "mpi4py>=4.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
ptychi = { git = "https://github.com/AdvancedPhotonSource/pty-chi.git", branch = "main" }

[project.scripts]
ptycho-fm-train = "ptycho_fm.train:main"
ptycho-fm-infer = "ptycho_fm.inference:main"

[dependency-groups]
dev = [
    "ipykernel>=7.0.1",
    "jupyter>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ptycho_fm"]

[tool.pytest.ini_options]
# These are standalone diagnostic scripts, not pytest-collectable tests.
addopts = "--ignore=tests/test_pack_hdf5_consistency.py --ignore=tests/debug_positions.py -m 'not integration'"
markers = [
    "integration: slower multi-process coverage excluded from the default test run",
]

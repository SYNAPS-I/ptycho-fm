[project]
name = "ptycho-fm"
version = "0.1.0"
description = "A foundation model for single-shot coherent diffractive imaging"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cmcrameri>=1.9",
    "h5py>=3.15.0",
    "matplotlib>=3.10.7",
    "numpy>=2.3.3",
    "onnx>=1.17.0",
    "pandas>=2.3.3",
    "ptychi>=1.5.0",
    "pyyaml>=6.0.3",
    "scikit-image>=0.25.2",
    "scipy>=1.16.3",
    "timm>=1.0.22",
    "torch>=2.6.0",
    "torchinfo>=1.8.0",
    "tqdm>=4.67.1",
    "wandb>=0.22.2",
]

[project.scripts]
ptycho-fm-train = "ptycho_fm.train:main"
ptycho-fm-infer = "ptycho_fm.inference:main"

[dependency-groups]
dev = [
    "ipykernel>=7.0.1",
    "jupyter>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ptycho_fm"]

[tool.pytest.ini_options]
# test_pack_hdf5_consistency is a standalone verification script that reads
# sys.argv[1] and hardcodes NERSC paths; it is not a pytest-collectable test.
addopts = "--ignore=tests/test_pack_hdf5_consistency.py"

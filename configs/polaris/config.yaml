# PtychoFM Training Configuration

# Data Configuration
data:
  # Option 1: Specify a list of specific files to use
  #datafiles:
  #   - '/pscratch/sd/e/edey/aileen/data/eagle256_dp.hdf5'
  #   - '/pscratch/sd/e/edey/aileen/data/cameraman256_dp.hdf5'
  #   - '/pscratch/sd/e/edey/aileen/data/brick256_dp.hdf5'
  #   - '/pscratch/sd/e/edey/aileen/data/grass256_dp.hdf5'
  #   - '/pscratch/sd/e/edey/aileen/data/gravel256_dp.hdf5'
  #   - '/pscratch/sd/e/edey/aileen/data/astronaut_dp.hdf5'
  #   - '/pscratch/sd/e/edey/aileen/data/rocket_dp.hdf5'    #test probe is simillar as those
  #   - '/pscratch/sd/e/edey/aileen/data/coffee_dp.hdf5'

  # Option 2: Specify a directory - will auto-discover all paired files
  # (comment out 'datafiles' above and uncomment this to use)
  # data_path: '/eagle/SYNAPS-I/data/lamni/2025-2/31ide_2025-06-12_subset/'
  data_path: '/eagle/SYNAPS-I/data/lamni/2025-3/31ide_2025-11-18/SparkPixRT2_130nm_subset5_rerecon'
  # test_path: '/lus/eagle/projects/SYNAPS-I/data/lamni/2025-2/31ide_2025-06-12_testset/S03999/ptychodus_dp.hdf5'
  test_path: '/eagle/SYNAPS-I/data/lamni/2025-3/31ide_2025-11-18/SparkPixRT2_130nm/eiger_4/S04000-04999/S04480/ptychodus_dp.hdf5'
  test_dataset_object_name: "eiger_4/S04000-04999/S04480/ptychodus"
  scale: 10000.0

  # Normalization dictionary: pickle file containing {object_name: normalization_factor} mapping
  # If not specified or file not found, will use default normalization value
  normalization_dict_path: '/eagle/SYNAPS-I/data/lamni/2025-3/31ide_2025-11-18/SparkPixRT2_130nm/normalization_31ide_2025-11-18_SparkPixRT2_130nm.pkl'
  # normalization_dict_path: '/pscratch/sd/e/edey/ptycho_peco/ptycho-vit/normalization_fulldata.pkl'
  # normalization_dict_path: '/pscratch/sd/e/edey/ptycho_peco/ptycho-vit/normalization.pkl'
  # test_normalization: '/eagle/SYNAPS-I/data/lamni/2025-2/31ide_2025-06-12/normalization_31ide_2025-06-12.pkl'
  test_normalization: '/eagle/SYNAPS-I/data/lamni/2025-3/31ide_2025-11-18/SparkPixRT2_130nm/normalization_31ide_2025-11-18_SparkPixRT2_130nm.pkl'

  train_split: 0.95  # Fraction of data for training (remainder used for validation)
  random_seed: 8

  max_probe_modes: 10
  max_OPR_modes: 1

  # DataLoader Configuration
  num_workers: 1
  prefetch_factor: 2
  pin_memory: true
  drop_last: true
  persistent_workers: true

  # Synthetic Poisson noise augmentation for the training and validation split.
  apply_noise: false
  # Keep false for measured data; enable explicitly for simulated test data.
  test_apply_noise: false
  default_normalization: 30000.0

# Training Configuration
training:
  mode: 'unsupervised' # Options: supervised, anything else defaults to unsupervised (no error raised)
  batch_size: 16
  learning_rate: 1.0e-4
  epochs: 50  # Total epochs to train for (not additional epochs when resuming)
  ngpus: 2
  loss_function: 'weighted'  # Options: smooth_l1, mse, l1, poisson_nll, weighted
  # Skip batch update if grad norm exceeds this value (null disables)
  skip_batch_if_grad_norm_greater_than: null

  platform: "polaris"

  # Weighted loss configuration (only used when loss_function='weighted')
  weighted_loss:
    loss_type: 'mae'  # Options: 'mse' or 'mae'
    threshold: 0.0    # Pixels below this value are ignored
    alpha: 0.0        # Weight exponent (1.0 = inverse weighting, 0.0 = uniform)
  validation_plot_freq: 1  # Plot validation results every N epochs
  test_plot_freq: 5
  resume_from_checkpoint: false  # Leave false to avoid loading old optimizer state
  finetune_from_model: '/lus/eagle/projects/SYNAPS-I/mingdu/ptycho-vit/workspace/models_for_FT/Fine_tune_360/best_model.pth'  # set to your pretrained weights

  checkpoint_freq: 1

# Model Architecture
model:
  encoder_type: 'custom'
  amp_scale: 0.2
  ph_scale: 3.14159
  amp_offset: 1.0

  encoder:
    img_size: 256
    patch_size: 16
    in_channels: 1
    embed_dim: 512
    depth: 12
    num_heads: 8
    mlp_ratio: 4.0
    use_cls_token: false
    dropout: 0.1
    attn_dropout: 0.0
  decoder:
    base_channels: 64
    latent_dim: 512     # Must match encoder embed_dim
    num_stages: 4       # 16x16 -> 256x256
    use_batchnorm: true
    dropout: 0.1
# Paths
paths:
  model_save_path: '/lus/eagle/projects/SYNAPS-I/mingdu/ptycho-vit/workspace/models_for_FT/Fine_tune_360/finetuned_model'

# WandB Configuration
wandb:
  enabled: true
  entity: 'SYNAPS-I'
  project: 'PtychoViT'
  dataset_name: 'SparkPixRT2_130nm_subset5_rerecon'
  notes: 'finetune from 360k'
  resume_run_id: null # Optional: manually specify wandb run ID to resume otherwise null 

# Trainer Configuration
trainer:
  run_num: 7

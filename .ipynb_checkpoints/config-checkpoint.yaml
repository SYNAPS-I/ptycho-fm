# PtychoViT Training Configuration

# Data Configuration
data:
  # Option 1: Specify a list of specific files to use
  # datafiles:
  #    - '/pscratch/sd/e/edey/aileen/data/eagle256_dp.hdf5'
  #    - '/pscratch/sd/e/edey/aileen/data/cameraman256_dp.hdf5'
  #    - '/pscratch/sd/e/edey/aileen/data/brick256_dp.hdf5'
  #    - '/pscratch/sd/e/edey/aileen/data/grass256_dp.hdf5'
  #    - '/pscratch/sd/e/edey/aileen/data/gravel256_dp.hdf5'
  #    - '/pscratch/sd/e/edey/aileen/data/astronaut_dp.hdf5'
  #    - '/pscratch/sd/e/edey/aileen/data/rocket_dp.hdf5'    #test probe is simillar as those
  #    - '/pscratch/sd/e/edey/aileen/data/coffee_dp.hdf5'
  data_path: '/pscratch/sd/e/edey/aileen/data'
  test_path: '/pscratch/sd/e/edey/aileen/test_data/scan807_dp.hdf5'
  scale: 10000.0

  # Normalization dictionary: pickle file containing {object_name: normalization_factor} mapping
  # If not specified or file not found, will use default normalization value
  # normalization_dict_path: '/pscratch/sd/e/edey/ptycho_peco/ptycho-vit/normalization_fulldata.pkl'  # Set to null if normalization file doesn't exist, or provide path to .pkl file
  normalization_dict_path: '/pscratch/sd/e/edey/aileen/data/normalization.pkl'
  test_normalization: '/pscratch/sd/e/edey/aileen/test_data/test2probes_norm.pkl'

  cache_object: true
  max_probe_modes: 10  # Maximum number of probe modes to pad to

  train_split: 0.95  # Fraction of data for training (remainder used for validation)
  random_seed: 8

  # Distributed data loading strategy:
  sharding_strategy: 'static'  # Options: 'static' or 'dynamic'

  # DataLoader Configuration
  num_workers: 2
  prefetch_factor: 2
  pin_memory: true  # Required for CUDAPrefetcher async transfer
  persistent_workers: true  # Keep workers alive across epochs
  use_cuda_prefetcher: false  # Set to false to disable async CUDA prefetching (may fix CUDA sync issues)

# Training Configuration
training:
  mode: 'unsupervised' # Options: supervised, anything else defaults to unsupervised (no error raised)
  batch_size: 32
  learning_rate: 1.0e-5  # Default learning rate (used if individual rates not specified)

  # Individual learning rates for model components (optional)
  # If not specified, will use the default learning_rate above
  # encoder_lr: 1.0e-7
  # amp_decoder_lr: 1.0e-6
  # ph_decoder_lr: 1.0e-6

  epochs: 11  # Total epochs to train for (not additional epochs when resuming)
  loss_function: 'weighted'  # Options: smooth_l1, mse, l1, poisson_nll, weighted

  # Weighted loss configuration (only used when loss_function: 'weighted')
  weighted_loss:
    loss_type: 'mse'  # Options: 'mse', 'mae'
    threshold: 0.0    # Pixels below this value are ignored
    alpha: 1.0        # Weight exponent (alpha=1 → inverse weighting (1/intensity), alpha=0 → uniform weighting)

  validation_plot_freq: 1  # Plot validation results every N epochs
  test_plot_freq: 1 # Plot stitched test results every M epochs
  resume_from_checkpoint: false  # Set to true to resume training from checkpoint
  finetune_from_model: '/pscratch/sd/e/edey/ptycho_peco/ptycho-vit/models/old_models/runcustom_45/best_model.pth'

# Model Architecture
# All models are fixed at 256x256 image size
model:
  encoder_type: 'custom'
  encoder:
    img_size: 256
    patch_size: 16
    in_channels: 1
    embed_dim: 512
    depth: 12
    num_heads: 8
    mlp_ratio: 4.0
    use_cls_token: false
    dropout: 0.1
    attn_dropout: 0.0
    # Pretrained source
    timm_model_name: 'vit_large_patch32_224'
    timm_kwargs:
      pretrained: false          # set true to download timm weights instead of local checkpoint
    checkpoint_path: 'model.safetensors'  # local pretrained weights
    checkpoint_kwargs:
      strict: true
  decoder:
    base_channels: 64
    latent_dim: 512
    num_stages: 4        # 8x8 → 256x256 for patch_size=32
    use_batchnorm: true
    dropout: 0.1

# Paths
paths:
  model_save_path: '/pscratch/sd/e/edey/variable_lr/models'

# WandB Configuration
wandb:
  enabled: false
  entity: 'SYNAPS-I'
  project: 'PtychoViT'
  dataset_name: 'simulated_360k'
  notes: 'Pretrained ViT, different LR for encoder and decoder'
  resume_run_id: null # Optional: manually specify wandb run ID to resume otherwise null 

# Trainer Configuration
trainer:
  run_num: variable_lr_test_finetuning

# PtychoViT Training Configuration

# Data Configuration
data:
  # Option 1: Specify a list of specific files to use
  # datafiles:
  #    - '/scratch/aileenluo/ptycho-vit/data/eagle256_dp.hdf5'
  #   # Add more files as needed:
  #    - '/scratch/aileenluo/ptycho-vit/data/cameraman256_dp.hdf5'
  #    - '/scratch/aileenluo/ptycho-vit/data/brick256_dp.hdf5'
  #    - '/scratch/aileenluo/ptycho-vit/data/grass256_dp.hdf5'
  #    - '/scratch/aileenluo/ptycho-vit/data/gravel256_dp.hdf5'

  # Option 2: Specify a directory - will auto-discover all paired files
  # (comment out 'datafiles' above and uncomment this to use)
  data_path: '/pscratch/sd/e/edey/ptycho_data'
  scale: 10000.0

  # Normalization dictionary: pickle file containing {object_name: normalization_factor} mapping
  # If not specified or file not found, will use default normalization value
  normalization_dict_path: '/pscratch/sd/e/edey/ptycho-vit/normalization.pkl'  # Example: '/path/to/normalization_factors.pkl'

  train_split: 0.95  # Fraction of data for training (remainder used for validation)
  random_seed: 41

  # DataLoader Configuration
  num_workers: 4
  prefetch_factor: 10
  pin_memory: true
  persistent_workers: false

# Training Configuration
training:
  mode: 'unsupervised' # Options: supervised, anything else defaults to unsupervised (no error raised)
  batch_size: 16
  learning_rate: 1.0e-5
  epochs: 201  # Total epochs to train for (not additional epochs when resuming)
  # ngpus: 2
  loss_function: 'l1'  # Options: smooth_l1, mse, l1, poisson_nll
  validation_plot_freq: 10  # Plot validation results every N epochs
  resume_from_checkpoint: false  # Set to true to resume training from checkpoint

# Model Architecture
model:
  # Model type selection: 'vit', 'cnn', 'cnn256', or 'vit256'
  model_type: 'pretrained256'  # Options: 'vit' (ViT for 512x512), 'cnn' (CNN for 512x512), 'cnn256' (CNN for 256x256), 'vit256' (ViT with CNN decoders for 256x256)

  # ViT Model Configuration for 512x512 images (used when model_type='vit')
  vit:
    encoder:
      img_size: 512
      patch_size: 16
      in_channels: 1
      embed_dim: 192
      depth: 12
      num_heads: 3
      mlp_ratio: 4.0
      use_cls_token: false
      dropout: 0.1
      attn_dropout: 0.0
    decoder:  # Shared decoder config (amp uses sigmoid, phase uses tanh)
      base_channels: 64
      latent_dim: 192     # Must match encoder embed_dim
      num_stages: 5       # 32x32 -> 512x512
      use_batchnorm: true
      dropout: 0.0

  # CNN Model Configuration for 512x512 images (used when model_type='cnn')
  cnn:
    encoder:
      in_channels: 1
      base_channels: 32
      latent_dim: 256
      num_stages: 5       # 512 -> 16
      use_batchnorm: true
      dropout: 0.1
    decoder:  # Shared decoder config (amp uses sigmoid, phase uses tanh)
      base_channels: 32
      latent_dim: 256
      num_stages: 5
      use_batchnorm: true
      dropout: 0.1

  # CNN Model Configuration for 256x256 images (used when model_type='cnn256')
  cnn256:
    encoder:
      in_channels: 1
      base_channels: 64
      latent_dim: 1024
      num_stages: 5       # 256 -> 8
      use_batchnorm: true
      dropout: 0.1
    decoder:  # Shared decoder config (amp uses sigmoid, phase uses tanh)
      base_channels: 64
      latent_dim: 1024
      num_stages: 5
      use_batchnorm: true
      dropout: 0.1

  # ViT with CNN Decoders for 256x256 images (used when model_type='vit256')
  vit256:
    encoder:
      img_size: 256
      patch_size: 16
      in_channels: 1
      embed_dim: 512
      depth: 12
      num_heads: 8
      mlp_ratio: 4.0
      use_cls_token: false
      dropout: 0.1
      attn_dropout: 0.0
    decoder:  # Shared decoder config (amp uses sigmoid, phase uses tanh)
      base_channels: 64
      latent_dim: 512     # Must match encoder embed_dim
      num_stages: 4       # 16x16 -> 256x256
      use_batchnorm: true
      dropout: 0.1
  # model_type: 'vit'  # Options: 'vit' (Vision Transformer), 'cnn' (Convolutional Neural Network)

  # Vision Transformer Encoder (used when model_type='vit')

  pretrained256:
    encoder:
      img_size: 256
      patch_size: 32
      in_channels: 1
      embed_dim: 1024
      depth: 24
      num_heads: 16
      mlp_ratio: 4.0
      use_cls_token: false
      dropout: 0.1  # Dropout for positional embedding and MLP layers
      attn_dropout: 0.0  # Dropout for attention weights
      timm_model_name: 'vit_large_patch32_224'
      timm_kwargs:
        pretrained: false                # <-- change this to false
        checkpoint_path: 'model.safetensors'
        # checkpoint_kwargs:
            # strict: true 
        # pretrained: true  # Set to true if pretrained weights are cached/available

  # Amplitude Decoder
    amp_decoder:
      embed_dim: 1024
      out_channels: 1
      # hidden_dims: [512, 256, 128, 64, 32]
      num_stages: 5
      activation: 'sigmoid'
      dropout: 0.1  # Dropout after each conv block

  # Phase Decoder
    ph_decoder:
      embed_dim: 1024
      out_channels: 1
      # hidden_dims: [512, 256, 128, 64, 32]
      num_stages: 5
      activation: 'tanh'
      dropout: 0.1  # Dropout after each conv block
# Paths
paths:
  model_save_path: '/pscratch/sd/e/edey/ptycho-vit/models'

# WandB Configuration
wandb:
  enabled: true
  entity: 'SYNAPS-I'
  project: 'PtychoViT'
  dataset_name: 'simulated_data folder, 100 samples, max incoherent modes: 30'
  notes: 'vitl32-256, 307M, log-polar, probe substraction, batch=16, LR=1e-05'
  resume_run_id: null # Optional: manually specify wandb run ID to resume otherwise null 

# Trainer Configuration
trainer:
  run_num: 509

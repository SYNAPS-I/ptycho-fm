# PtychoViT Training Configuration

# Data Configuration
data:
  data_path: '/pscratch/sd/s/shas1693/data/ptycho/simulated_data_cleanedProbe_2_packed'
  packed: true # set to true if using packed data
  test_path: '/pscratch/sd/s/shas1693/data/ptycho/aileen/test_data/scan807_dp.hdf5'
  scale: 10000.0

  # Normalization dictionary: pickle file containing {object_name: normalization_factor} mapping
  # If not specified or file not found, will use default normalization value
  # normalization_dict_path: '/pscratch/sd/e/edey/ptycho_peco/ptycho-vit/normalization_fulldata.pkl'  # Set to null if normalization file doesn't exist, or provide path to .pkl file
  normalization_dict_path: '/pscratch/sd/s/shas1693/data/ptycho/normalization.pkl'
  test_normalization: '/pscratch/sd/s/shas1693/data/ptycho/aileen/test_data/test2probes_norm.pkl'
  default_normalization: 100000.0
  apply_noise: true
  deterministic_noise: true
  noise_seed: 42

  cache_object: true
  max_probe_modes: 10  # Maximum number of probe modes to pad to
  target_size: 256  # Target size for diffraction patterns (pads smaller patterns, upsamples probe)

  train_split: 0.975  # Fraction of data for training (2.5% held out for validation/test)
  random_seed: 8
  # Optional: use only the first fraction of samples from the full dataset (0 < fraction <= 1)
  # subset_fraction: 0.1

  # Distributed data loading strategy:
  sharding_strategy: 'dynamic'  # Options: 'static' or 'dynamic'

  # Limit number of files to use (for faster testing). Set to null to use all files.
  # ~2000 patterns per file on average, so 100 files ≈ 200k patterns
  max_files: null

  # DataLoader Configuration
  num_workers: 4
  prefetch_factor: 2
  pin_memory: true  # Required for CUDAPrefetcher async transfer
  drop_last: true
  persistent_workers: true  # Keep workers alive across epochs
  use_cuda_prefetcher: true  # Set to false to disable async CUDA prefetching (may fix CUDA sync issues)

# Training Configuration
training:
  mode: 'unsupervised' # Options: supervised, anything else defaults to unsupervised (no error raised)
  batch_size: 32
  valid_batch_size: 32
  learning_rate: 1.0e-6  # Default learning rate (used if individual rates not specified)
  # Optional: learning rate scheduler
  # Two scheduler classes are supported:
  #   warmup-stable  – linear warmup then constant LR (for long pretraining runs)
  #   cooldown       – sqrt decay LR to 0 in this phase
  # Optional: cooldown scheduler configuration
  #  scheduler_class: 'cooldown'
  #  kwargs:
  #    branch_from: '/pscratch/sd/s/shas1693/data/ptycho/models/runlr1em6/state_iters_52000.pth'
  #    cooldown_steps: 4000
  # Use a different run_num and run_name from the pretraining run for cooldowns
  lr_scheduler:
    enabled: true
    scheduler_class: 'warmup-stable'
    kwargs:
      warmup_steps: 2000
  # Optional: per-epoch subsetting of the training set only (validation unaffected)
  data_subsetting_schedule:
    enabled: false
    epochs: [0, 3, 5]
    fractions: [0.05, 0.2, 1.0]

  # Individual learning rates for model components (optional)
  # If not specified, will use the default learning_rate above
  # encoder_lr: 1.0e-7
  # amp_decoder_lr: 1.0e-6
  # ph_decoder_lr: 1.0e-6

  epochs: 100  # Total epochs to train for (not additional epochs when resuming)
  log_every: 4000 # Log every N iterations
  log_at_flops: [6.0e17, 1.0e18, 3.0e18, 6.0e18, 8.0e18, 1.0e19] # Raw FLOP targets for logging/validation, e.g. [6.0e17, 1.0e18, 3.0e18]; empty uses log_every
  loss_function: 'weighted'  # Options: smooth_l1, mse, l1, poisson_nll, weighted
  # Skip batch update if grad norm exceeds this value (null disables)
  skip_batch_if_grad_norm_greater_than: null

  # Weighted loss configuration (only used when loss_function: 'weighted')
  weighted_loss:
    loss_type: 'mse'  # Options: 'mse', 'mae'
    threshold: 0.0    # Pixels below this value are ignored
    alpha: 1.0        # Weight exponent (alpha=1 → inverse weighting (1/intensity), alpha=0 → uniform weighting)

  validation_plot_freq: 1  # Plot validation results every N epochs
  test_plot_freq: 1 # Plot stitched test results every M epochs
  resume_from_checkpoint: true  # Set to true to resume training from checkpoint
  # Save model weights each epoch as model_epoch_XXX.pth
  save_epoch_models: true
  # Save full training state (optimizer etc.) every N epochs; 0 disables (can be large for Adam).
  checkpoint_freq: 1
  finetune_from_model: null

  profile: false

# Model Architecture
# All models are fixed at 256x256 image size
model:
  init:
    enabled: false
    method: 'trunc_normal'  # options: trunc_normal, kaiming
    mean: 0.0
    std: 0.02
    apply_to: ['encoder', 'decoders']  # options: encoder, decoders
    override_pretrained: false
    kaiming:
      distribution: 'uniform'  # options: uniform, normal
      mode: 'fan_in'           # options: fan_in, fan_out
      nonlinearity: 'relu'     # options: relu, leaky_relu, linear, etc.
      a: 0.0                   # negative slope for leaky_relu
  encoder_type: 'custom'  # Options: 'custom', 'pretrained'
  # Encoder Configuration
  encoder:
    img_size: 256
    patch_size: 16
    in_channels: 1
    embed_dim: 512
    depth: 12
    num_heads: 8
    mlp_ratio: 4.0
    use_cls_token: false
    dropout: 0.0
    attn_dropout: 0.0
    # Pretrained source
    timm_model_name: 'vit_large_patch32_224' #initialization with ViT_L_32 model weights'
    timm_kwargs:
      pretrained: false          # set true to download timm weights instead of local checkpoint
    checkpoint_path: 'model.safetensors'  # local pretrained weights
    checkpoint_kwargs:
      strict: true
  decoder:
    base_channels: 64
    latent_dim: 512
    num_stages: 4        # 8x8 → 256x256 for patch_size=32
    use_batchnorm: true
    dropout: 0.0

# Paths
paths:
  model_save_path: '/pscratch/sd/s/shas1693/data/ptycho/models'

# WandB Configuration
wandb:
  enabled: true
  entity: 'nersc-das'
  project: 'ptycho-vit'
  dataset_name: 'simulated full data'
  notes: 'Custom ViT, 43M'
  run_name: 'scaling-lr1em6-check5'
  resume_run_id: null # Optional: manually specify wandb run ID to resume otherwise null 

# Trainer Configuration
trainer:
  run_num: 'scaling-lr1em6-check5'


# PtychoViT Training Configuration

# Data Configuration
data:
  # Directory path - will auto-discover all paired *_dp.hdf5 and *_para.hdf5 files
  data_path: '/lus/flare/projects/PPFL_FM/ptycho_data' #'/scratch/aileenluo/ptycho-vit/data'
  test_path: '/lus/flare/projects/PPFL_FM/test_data/scan807_dp.hdf5' #'/home/beams/AILEENLUO/ptycho_simulation_factory/outputs/scan807/scan807_dp.hdf5'
  scale: 10000.0

  # Normalization dictionary: pickle file containing {object_name: normalization_factor} mapping
  # If not specified or file not found, will use default normalization value
  normalization_dict_path: '/flare/datascience/vsastry/projects/ptcho_vit/ptycho-vit/normalization.pkl' #'/scratch/aileenluo/ptycho-vit/data/normalization.pkl'  # Set to null if normalization file doesn't exist, or provide path to .pkl file
  test_normalization: '/lus/flare/projects/PPFL_FM/test_data/test2probes_norm.pkl' 

  train_split: 0.95  # Fraction of data for training (remainder used for validation)
  random_seed: 8
  max_probe_modes: 10  # Maximum number of probe modes to pad to

  # Distributed data loading strategy:
  sharding_strategy: 'static'  # Options: 'static' or 'dynamic'

  # DataLoader Configuration
  num_workers: 4
  prefetch_factor: 1 
  pin_memory: true  # Required for CUDAPrefetcher async transfer
  persistent_workers: true  # Keep workers alive across epochs

# Training Configuration
training:
  mode: 'unsupervised' # Options: supervised, anything else defaults to unsupervised (no error raised)
  batch_size: 64  
  learning_rate: 1.0e-4
  epochs: 1  # Total epochs to train for (not additional epochs when resuming)
  loss_function: 'weighted'  # Options: smooth_l1, mse, l1, poisson_nll, weighted

  # Weighted loss configuration (only used when loss_function: 'weighted')
  weighted_loss:
    loss_type: 'mse'  # Options: 'mse', 'mae'
    threshold: 0.0    # Pixels below this value are ignored
    alpha: 1.0        # Weight exponent (alpha=1 → inverse weighting (1/intensity), alpha=0 → uniform weighting)

  validation_plot_freq: 10  # Plot validation results every N epochs
  test_plot_freq: 20 # Plot stitched test results every M epochs
  resume_from_checkpoint: false  # Set to true to resume training from checkpoint

# Model Architecture
# All models are fixed at 256x256 image size
model:
  # Encoder type selection: 'custom' (train from scratch) or 'pretrained' (use pretrained encoder)
  encoder_type: 'pretrained' #'custom'  # Options: 'custom', 'pretrained'
  # Encoder Configuration
  encoder:
    img_size: 256
    patch_size: 32
    in_channels: 1
    embed_dim: 1024
    depth: 24
    num_heads: 16
    mlp_ratio: 4.0
    use_cls_token: false
    dropout: 0.1
    attn_dropout: 0.0
    # Additional options for pretrained encoder (only used when encoder_type: 'pretrained')
    timm_model_name: 'vit_large_patch32_224' 
    timm_kwargs: 
      pretrained: false    
    checkpoint_path: '/lus/flare/projects/PPFL_FM/pretrained_model_weights/model.safetensors' 
    checkpoint_kwargs:                  
      strict: true                     

  # Decoder Configuration (independent of encoder type)
  decoder:
    base_channels: 64
    latent_dim: null    # If null, automatically uses encoder.embed_dim
    num_stages: 5      # Number of upsampling stages (depends on patch_size)
    use_batchnorm: true
    dropout: 0.1

# Paths
paths:
  model_save_path: '/flare/datascience/vsastry/projects/ptcho_vit/ptycho-vit/scratch/models' #'/scratch/aileenluo/ptycho-vit/models'

# WandB Configuration
wandb:
  enabled: false
  entity: 'SYNAPS-I'
  project: 'PtychoViT'
  dataset_name: '2 s26 probes'
  notes: 'vit_large_patch32_224 pretrained run' 
  resume_run_id: null # Optional: manually specify wandb run ID to resume otherwise null 

# Trainer Configuration
trainer:
  run_num: 1

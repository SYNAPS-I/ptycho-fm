# PtychoFM Training Configuration

# Data Configuration
data:
  data_path: '/mnt/localdisk/scratch/aileenluo/sim_cleanedProbe_2_packed'
  packed: true # set to true if using packed data
  test_path: '/mnt/localdisk/scratch/aileenluo/finetune_20260225/scan_43_100035_dp.hdf5'
  test_dataset_object_name: null  # Optional normalization-map key for the test object
  scale: 10000.0
  # Synthetic Poisson noise augmentation for the training and validation split.
  apply_noise: true
  deterministic_noise: false
  noise_seed: 0
  # Independent test/inference augmentation. Keep false for measured data, which
  # already contains experimental noise; enable explicitly for simulated test data.
  test_apply_noise: false

  # Normalization dictionary: pickle file containing {object_name: normalization_factor} mapping
  # Omitted file or missing object key uses the default; invalid/unreadable files raise an error.
  # normalization_dict_path: '/pscratch/sd/e/edey/ptycho_peco/ptycho-vit/normalization_fulldata.pkl'  # Set to null if normalization file doesn't exist, or provide path to .pkl file
  normalization_dict_path: '/mnt/localdisk/scratch/aileenluo/sim_cleanedProbe_2_packed/normalization.pkl'
  test_normalization: '/mnt/localdisk/scratch/aileenluo/norm_20260225.pkl'
  default_normalization: 10000.0

  cache_object: false
  cache_memory_budget_mb: 512  # MiB of CPU arrays per worker; applies to unpacked/test loaders, 0 disables
  max_probe_modes: 10  # Maximum number of probe modes to pad to
  max_OPR_modes: 1  # Minimum OPR mode count for unpacked/test loaders; larger inputs are preserved
  # Diffraction patterns and probes retain native spatial dimensions, which must match the model.

  train_split: 0.95  # Fraction of objects for training
  random_seed: 8
  # Optional: use only the first fraction of objects from the full dataset (0 < fraction <= 1)
  # subset_fraction: 0.1

  # Distributed data loading strategy:
  sharding_strategy: 'dynamic'  # Options: 'static' or 'dynamic'

  # Limit number of files to use (for faster testing). Set to null to use all files.
  max_files: null  # For non-packed data
  max_shards: 200  # Packed datasets only; null uses every packed shard

  # DataLoader Configuration
  num_workers: 4
  prefetch_factor: 2
  pin_memory: true  # Required for CUDAPrefetcher async transfer
  drop_last: true
  persistent_workers: true  # Keep workers alive across epochs
  use_cuda_prefetcher: true  # Set to false to disable async CUDA prefetching (may fix CUDA sync issues)

# Training Configuration
training:
  mode: 'unsupervised' # Options: supervised, anything else defaults to unsupervised (no error raised)
  batch_size: 128
  # Iteration/FLOP validation is opt-in; zero/empty retains epoch training.
  log_every: 0
  log_at_flops: []
  max_iters: null
  track_flops: false
  stop_at_last_flop_target: false
  # valid_batch_size defaults to batch_size when omitted.
  learning_rate: 1.0e-5  # Default learning rate (used if individual rates not specified)
  # Optional: learning rate scheduler
  lr_scheduler:
    enabled: false
    scheduler_class: 'CyclicLR'
    kwargs: {}
  # Optional: per-epoch subsetting of the training set only (validation unaffected)
  data_subsetting_schedule:
    enabled: false
    epochs: [0, 3, 5]
    fractions: [0.05, 0.2, 1.0]

  # Individual learning rates for model components
  encoder_lr: 1.0e-5
  amp_decoder_lr: 1.0e-5
  ph_decoder_lr: 1.0e-5
  coupled_decoder_lr: 1.0e-5

  epochs: 2  # Total epochs to train for (not additional epochs when resuming)
  loss_function: 'weighted'  # Options: smooth_l1, mse, l1, poisson_nll, total_flux, weighted, probe_aware, q_dependent, combined
  # Skip batch update if grad norm exceeds this value (null disables)
  skip_batch_if_grad_norm_greater_than: null

  # Weighted loss configuration (only used when loss_function: 'weighted')
  weighted_loss:
    loss_type: 'mse'  # Options: 'mse', 'mae'
    threshold: 1e-6    # Pixels below this value are ignored
    alpha: 1.0        # Weight exponent (alpha=1 → inverse weighting (1/intensity), alpha=0 → uniform weighting)

  # Combined loss configuration (only used when loss_function: 'combined')
  combined_loss:
    - type: 'l1'
      weight: 1.0
    - type: 'weighted'
      weight: 5.0

  # Probe-aware loss configuration
  probe_aware_loss:
    loss_type: 'mae'
    threshold: 1.0e-6
    alpha: 0.5
    envelope_floor: 0.05
    eps: 1.0e-6

  # Q-dependent loss configuration
  q_dependent_loss:
    loss_type: 'mse'
    alpha: 1.0
    q_beta: 1.0
    q_floor: 0.05
    threshold: 1.0e-6
    log_error: true
    normalize_q: true
    eps: 1.0e-6

  validation_plot_freq: 1  # Plot validation results every N epochs
  validation_plot_num_objects: 10  # Number of complete validation objects to stitch; null logs all
  validation_plot_central_crop: 64
  validation_plot_object_crop: 180
  test_plot_freq: 1 # Plot stitched test results every M epochs
  test_plot_central_crop: 64
  test_plot_object_crop: 180
  resume_from_checkpoint: true  # Set to true to resume training from checkpoint
  # Save model weights each epoch as model_epoch_XXX.pth
  save_epoch_models: true
  # Save full training state (optimizer etc.) every N epochs; 0 disables (can be large for Adam).
  checkpoint_freq: 1
  # Optional model-only checkpoint for fine-tuning. Uses fresh optimizer/tracking state;
  # explicitly configured model.output_norm values override those in the checkpoint.
  finetune_from_model: null

  profile: false

# Model Architecture
# All models are fixed at 256x256 image size
model:
  # Decoder type: 'standard' or 'resnet'. Applies to separate and coupled decoders.
  decoder_type: 'standard'

  # Coupled decoder: null, 'real_imag', or 'amp_phase'.
  coupled_decoder_mode: 'amp_phase'

  init:
    enabled: false
    method: 'trunc_normal'  # options: trunc_normal, kaiming
    mean: 0.0
    std: 0.02
    apply_to: ['encoder', 'decoders']  # options: encoder, decoders
    override_pretrained: false
    kaiming:
      distribution: 'uniform'  # options: uniform, normal
      mode: 'fan_in'           # options: fan_in, fan_out
      nonlinearity: 'relu'     # options: relu, leaky_relu, linear, etc.
      a: 0.0                   # negative slope for leaky_relu
  encoder_type: 'custom'  # Options: 'custom', 'pretrained'
  # Encoder Configuration
  encoder:
    img_size: 256
    patch_size: 16
    in_channels: 1
    embed_dim: 512
    depth: 12
    num_heads: 8
    mlp_ratio: 4.0
    use_cls_token: false
    dropout: 0.1
    attn_dropout: 0.0
    # Pretrained source
    timm_model_name: 'vit_large_patch32_224' #initialization with ViT_L_32 model weights'
    timm_kwargs:
      pretrained: false          # set true to download timm weights instead of local checkpoint
    checkpoint_path: 'model.safetensors'  # local pretrained weights
    checkpoint_kwargs:
      strict: true
  decoder:
    base_channels: 64
    latent_dim: 512
    num_stages: 4        # 8x8 → 256x256 for patch_size=32
    use_batchnorm: true
    dropout: 0.1
    blocks_per_stage: 2
    phase_activation: 'custom'  # atan2, tanh, custom, or null
    circular_phase: false       # Coupled amp/phase decoder only

  # Physical output scales are configured directly; models store scale parameters
  # in log-space. During fine-tuning these values override checkpoint values.
  output_norm:
    amp_scale: 0.2
    amp_offset: 0.9
    ph_scale: 3.14159
    real_scale: 0.1
    real_offset: 1.0
    imag_scale: 0.1
    imag_offset: 0.0

# Paths
paths:
  model_save_path: '/mnt/localdisk/scratch/aileenluo/models'

# Experiment Tracking
# Enable exactly one backend. Keep the unused backend's entire block commented
# out; set the enabled backend to false only when no remote tracking is wanted.
# These controls have the same meaning for W&B and MLflow.
tracking:
  dataset_name: '40% simulated full data, packed'
  notes: '43M shared amp/ph dec, MLFlow'
  log_parameters: true
  log_metrics: true
  log_artifacts: true
  log_system_metrics: false
  log_every_n_batches: null  # Set to null to disable batch metrics (epoch-only mode)

# Weights & Biases backend (select either wandb or MLflow and comment out the other)
# wandb:
#   enabled: true
#   entity: 'nersc-das'
#   project: 'ptycho-fm'

# MLflow backend
mlflow:
  enabled: true
  tracking_uri: 'http://127.0.0.1:15000'
  experiment_name: 'PtychoFM'
  tags: {}
  azureml_compat: false  # Enable only for Azure ML registry endpoints

# Trainer Configuration
trainer:
  run_name: '20260924-191531'  # Fresh runs generate YYYYMMDD-HHMMSS; set it to that name to resume

# PtychoViT — STEP 1 sanity check: SUPERVISED + single 8-mode probe
# Aileen 2-probe dataset. Compares predicted object patch DIRECTLY to the true
# object patch (mode: supervised). Restricted to the 8-mode probe (5 objects).
# Goal: is the pipeline capable of learning at all under the easiest objective?

# Data Configuration
data:
  data_path: '/flare/SYNAPS-I/aileen/data'                 # <-- aileen training set (8 objects)
  test_path: '/flare/SYNAPS-I/aileen/test_data/coins256_dp.hdf5'  # 8-mode test object (matches probe)
  scale: 10000.0

  normalization_dict_path: '/flare/SYNAPS-I/aileen/data/normalization.pkl'   # <-- aileen's own norm dict
  test_normalization: '/flare/SYNAPS-I/aileen/test_data/test2probes_norm.pkl'
  data_fraction: 1.0        # use ALL of the chosen probe's objects (dataset is small)
  probe_filter: 'modes=8'   # <-- SINGLE PROBE: keep only the 8-mode-probe objects
  cache_object: true
  train_split: 0.95
  random_seed: 8
  max_probe_modes: 10

  sharding_strategy: 'static'
  num_workers: 0
  prefetch_factor: 1
  pin_memory: true
  persistent_workers: true
  use_cuda_prefetcher: false

# Training Configuration
training:
  mode: 'supervised'        # <-- SUPERVISED: loss = |amp'-amp_gt| + |ph'-ph_gt| (uses known object)
  batch_size: 64
  learning_rate: 1.0e-4
  epochs: 50

  encoder_lr: 1.0e-4
  amp_decoder_lr: 1.0e-4
  ph_decoder_lr: 1.0e-4

  loss_function: 'mse'      # <-- plain MSE for object-space. ('weighted' is for diffraction, don't use here)

  validation_plot_freq: 10
  test_plot_freq: 20
  resume_from_checkpoint: false

# Model Architecture (unchanged from config.yaml)
model:
  encoder_type: 'pretrained'
  encoder:
    img_size: 256
    patch_size: 32
    in_channels: 1
    embed_dim: 1024
    depth: 24
    num_heads: 16
    mlp_ratio: 4.0
    use_cls_token: false
    dropout: 0.1
    attn_dropout: 0.0
    timm_model_name: 'vit_large_patch32_224'
    timm_kwargs:
      pretrained: false
    checkpoint_path: '/lus/flare/projects/PPFL_FM/pretrained_model_weights/model.safetensors'
    checkpoint_kwargs:
      strict: true
  decoder:
    base_channels: 64
    latent_dim: null
    num_stages: 5
    use_batchnorm: true
    dropout: 0.1

# Paths
paths:
  model_save_path: '/flare/datascience/vsastry/projects/ptcho_vit/ptycho-vit/scratch/models'

# WandB Configuration
wandb:
  enabled: True
  entity: 'varunisastry'
  project: 'PtychoViT'
  dataset_name: 'aileen 8-mode only'
  notes: 'supervised, single 8-mode probe (5 objects)'
  resume_run_id: null

# Trainer Configuration
trainer:
  run_num: 8       # RUN 2 of 3 (only 8-mode)
